name: Unit tests and docs generation

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  check:
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Set OS and Python version
        id: set-vars
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            echo "os-matrix=ubuntu-latest,windows-latest" >> $GITHUB_ENV
            echo "python-matrix=3.9,3.11,3.12" >> $GITHUB_ENV
          else
            echo "os-matrix=ubuntu-latest" >> $GITHUB_ENV
            echo "python-matrix=3.12" >> $GITHUB_ENV
          fi
      - name: Checkout
        uses: actions/checkout@v3
      - name: Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache Poetry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-${{ matrix.python-version }}-
      - name: Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
      - name: Lock
        run: poetry lock --no-update
      - name: Install
        run: poetry install
      - name: Checkers
        run: make checkers
      - name: Codecov
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Check Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            docs/**
            **.rst

      - name: Build Docs
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' && steps.changed-files.outputs.any_changed == 'true'
        run: |
          poetry run sphinx-build -b html docs/ _build/html
